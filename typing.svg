<svg xmlns="http://www.w3.org/2000/svg" width="460" height="50" viewBox="0 0 460 50">
  <style>
    text { font-family: ui-monospace, Consolas, 'Courier New', monospace; font-size: 26px; font-weight: 600; }
    .i { fill: #1f2328; }
    @media (prefers-color-scheme: dark) { .i { fill: #e6edf3; } }
  </style>

  <defs>
    <clipPath id="c1">
      <rect x="70" y="0" height="50" width="0">
        <animate attributeName="width" dur="9s" repeatCount="indefinite"
          keyTimes="0;0.12;0.28;0.33;1" values="0;350;350;0;0"/>
      </rect>
    </clipPath>
    <clipPath id="c2">
      <rect x="70" y="0" height="50" width="0">
        <animate attributeName="width" dur="9s" repeatCount="indefinite"
          keyTimes="0;0.333;0.453;0.613;0.663;1" values="0;0;350;350;0;0"/>
      </rect>
    </clipPath>
    <clipPath id="c3">
      <rect x="70" y="0" height="50" width="0">
        <animate attributeName="width" dur="9s" repeatCount="indefinite"
          keyTimes="0;0.667;0.787;0.947;0.997;1" values="0;0;350;350;0;0"/>
      </rect>
    </clipPath>
  </defs>

  <text class="i" x="0" y="35">I'm</text>
  <text x="70" y="35" fill="#2F81F7" clip-path="url(#c1)">Web Developer</text>
  <text x="70" y="35" fill="#3FB950" clip-path="url(#c2)">Mobile Developer</text>
  <text x="70" y="35" fill="#F778BA" clip-path="url(#c3)">Full Stack Developer</text>
</svg>
